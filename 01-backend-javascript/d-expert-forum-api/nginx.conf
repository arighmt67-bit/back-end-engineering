##
# Konfigurasi NGINX untuk Forum API
#
# Memenuhi dua kriteria submission:
#   1. Limit Access  - membatasi resource /threads sebanyak 90 request per menit
#                      sebagai langkah preventif terhadap DDoS Attack.
#   2. HTTPS         - seluruh lalu lintas dialihkan ke TLS agar terhindar dari
#                      serangan Man In The Middle (MITM).
#
# Lokasi pemasangan di server: /etc/nginx/sites-available/forumapi
# lalu ditautkan ke /etc/nginx/sites-enabled/forumapi
#
# Catatan: blok `limit_req_zone` di bawah harus berada pada konteks `http`.
# Bila berkas ini dimuat melalui `include` dari nginx.conf utama, baris
# limit_req_zone tersebut sudah otomatis berada pada konteks yang benar.
##

# Zona penampung status pembatasan permintaan.
#   $binary_remote_addr : pembatasan dihitung per alamat IP klien.
#   zone=threads_limit  : nama zona, dialokasikan 10 MB (menampung ~160.000 IP).
#   rate=90r/m          : 90 request per menit, sesuai ketentuan submission.
limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

# Balasan 429 (Too Many Requests) lebih tepat daripada bawaan 503,
# sehingga klien tahu penolakan terjadi karena pembatasan laju.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name forumapi-arirahmat.dcdg.xyz;

    # Seluruh permintaan HTTP dialihkan permanen ke HTTPS.
    # Blok ini disisipkan otomatis oleh Certbot saat sertifikat dipasang.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forumapi-arirahmat.dcdg.xyz;

    # Sertifikat diterbitkan Let's Encrypt melalui Certbot.
    ssl_certificate     /etc/letsencrypt/live/forumapi-arirahmat.dcdg.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forumapi-arirahmat.dcdg.xyz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ##
    # Resource /threads beserta seluruh path di dalamnya dibatasi
    # 90 request per menit. Ditulis sebelum `location /` agar NGINX
    # memilih blok ini lebih dulu untuk awalan URI yang cocok.
    #
    # Ditulis TANPA parameter `burst` mengikuti modul kelas, sehingga
    # pembatasan berlaku seketika: permintaan yang datang lebih cepat dari
    # satu per ~0,67 detik (90 request per menit) langsung dibalas 429.
    # Catatan revisi: konfigurasi sebelumnya memakai `burst=90 nodelay`,
    # yang mengizinkan 90 permintaan menumpuk sekaligus sehingga menjalankan
    # seluruh Postman collection tanpa delay (42 request ke /threads)
    # tidak pernah memicu error limit access.
    ##
    location /threads {
        limit_req zone=threads_limit;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Resource selain /threads tidak dibatasi.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
