spring.application.name=helpdesk-api

# ---------- Profil aktif ----------
# dev  = H2 in-memory, tanpa perlu database eksternal (default)
# prod = PostgreSQL, dikonfigurasi lewat environment variable
spring.profiles.active=dev

# ---------- JWT ----------
# Ditulis sebagai Duration (30m), bukan angka telanjang, agar satuannya eksplisit.
app.jwt.secret=${JWT_SECRET:ganti-secret-ini-minimal-32-karakter-untuk-hs256}
app.jwt.expiration=30m
app.jwt.issuer=helpdesk-api

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------- Redis cache ----------
# Default lokal tetap tanpa infrastruktur eksternal. Profile prod mengaktifkan Redis.
spring.cache.type=${CACHE_TYPE:none}
app.cache.ticket-ttl=${TICKET_CACHE_TTL:10m}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# ---------- Kafka producer ----------
# Producer dinonaktifkan secara default agar workflow H2 lokal tetap mandiri.
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.ticket-events-topic=${TICKET_EVENTS_TOPIC:helpdesk.ticket-events.v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:3000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:3000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:5000}
app.kafka.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1000}
app.kafka.outbox.ack-timeout=${OUTBOX_ACK_TIMEOUT:5s}

# Flyway baru aktif pada profile/infrastruktur yang menyediakannya.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
