# Profil prod: PostgreSQL. Semua nilai sensitif diambil dari environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tidak boleh fallback ke secret development saat profile prod aktif.
app.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

spring.h2.console.enabled=false

# Redis dan Kafka aktif di production, tetapi tetap bisa dioverride lewat environment.
spring.cache.type=${CACHE_TYPE:redis}
app.kafka.enabled=${KAFKA_ENABLED:true}
# Schema production dikelola oleh migration versioned di db/migration.
# Existing schema tanpa history dibaseline di V1; V2 outbox tetap dijalankan.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
