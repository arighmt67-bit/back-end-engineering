spring.application.name=helpdesk-notification-worker
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk_notification}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}

app.kafka.ticket-events-topic=${TICKET_EVENTS_TOPIC:helpdesk.ticket-events.v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:helpdesk-notification-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.arirahmat.helpdesk.notification.event.TicketEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.arirahmat.helpdesk.notification.event

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
